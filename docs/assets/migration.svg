<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="换一个地方，也不用重新认识你">
<title>换一个地方，也不用重新认识你</title><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0} .b{font-weight:700}</style>
<rect x="0" y="0" width="1280" height="400" rx="0" fill="#f7faf8" /><text x="640" y="64" font-size="34" fill="#183e39" text-anchor="middle" class="b">换一个地方，也不用重新认识你。</text><text x="640" y="104" font-size="20" fill="#66847b" text-anchor="middle">一键打包程序、记忆和情感，在新电脑上继续原来的聊天。</text><rect x="100" y="153" width="250" height="123" rx="6" fill="#d5eee7" /><text x="225" y="210" font-size="34" fill="#183e39" text-anchor="middle" class="b">BigFish</text><line x1="165" y1="239" x2="285" y2="239" stroke="#117966" stroke-width="3" /><text x="225" y="316" font-size="24" fill="#183e39" text-anchor="middle" class="b">现在的电脑</text><text x="225" y="353" font-size="17" fill="#66847b" text-anchor="middle">你们已经聊过的日子</text><rect x="510" y="153" width="250" height="123" rx="6" fill="#f0dce4" /><text x="635" y="210" font-size="20" fill="#183e39" text-anchor="middle" class="b">TAKE US WITH YOU</text><line x1="575" y1="239" x2="695" y2="239" stroke="#c38e9e" stroke-width="3" /><text x="635" y="316" font-size="24" fill="#183e39" text-anchor="middle" class="b">一份 ZIP</text><text x="635" y="353" font-size="17" fill="#66847b" text-anchor="middle">程序 + 原文 + 记忆 + 情感</text><rect x="925" y="153" width="250" height="123" rx="6" fill="#d5eee7" /><text x="1050" y="210" font-size="34" fill="#183e39" text-anchor="middle" class="b">BigFish</text><line x1="990" y1="239" x2="1110" y2="239" stroke="#117966" stroke-width="3" /><text x="1050" y="316" font-size="24" fill="#183e39" text-anchor="middle" class="b">下一台电脑</text><text x="1050" y="353" font-size="17" fill="#66847b" text-anchor="middle">安装、连接、接着聊</text><line x1="375" y1="216" x2="477" y2="216" stroke="#117966" stroke-width="3" /><path d="M 469 209 L 477 216 L 469 223" fill="none" stroke="#117966" stroke-width="3"/><line x1="785" y1="216" x2="887" y2="216" stroke="#117966" stroke-width="3" /><path d="M 879 209 L 887 216 L 879 223" fill="none" stroke="#117966" stroke-width="3"/><text x="640" y="386" font-size="14" fill="#66847b" text-anchor="middle">API 密钥留在原机 · 新电脑使用自己的连接配置</text></svg>