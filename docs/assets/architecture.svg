<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-label="先归档，再压缩，旧活动对象释放，同一会话继续">
<title>先归档，再压缩，旧活动对象释放，同一会话继续</title><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0} .b{font-weight:700}</style>
<rect x="0" y="0" width="1280" height="530" rx="0" fill="#f7faf8" /><text x="55" y="62" font-size="34" fill="#183e39" class="b">轻装继续，完整珍藏。</text><text x="55" y="101" font-size="20" fill="#66847b" >原文在硬盘，近期对话与重要记忆在工作区。</text><text x="55" y="158" font-size="17" fill="#117966" class="b">01</text><line x1="55" y1="174" x2="290" y2="174" stroke="#117966" stroke-width="3" /><text x="55" y="218" font-size="25" fill="#183e39" class="b">先保存</text><text x="55" y="258" font-size="19" fill="#183e39" >原始事件落盘</text><text x="55" y="292" font-size="17" fill="#66847b" >来源、时间与校验</text><line x1="302" y1="232" x2="342" y2="232" stroke="#117966" stroke-width="3" /><path d="M 334 225 L 342 232 L 334 239" fill="none" stroke="#117966" stroke-width="3"/><text x="365" y="158" font-size="17" fill="#117966" class="b">02</text><line x1="365" y1="174" x2="600" y2="174" stroke="#117966" stroke-width="3" /><text x="365" y="218" font-size="25" fill="#183e39" class="b">再整理</text><text x="365" y="258" font-size="19" fill="#183e39" >摘要 + 记忆 + 情感</text><text x="365" y="292" font-size="17" fill="#66847b" >检查点验证</text><line x1="612" y1="232" x2="652" y2="232" stroke="#117966" stroke-width="3" /><path d="M 644 225 L 652 232 L 644 239" fill="none" stroke="#117966" stroke-width="3"/><text x="675" y="158" font-size="17" fill="#117966" class="b">03</text><line x1="675" y1="174" x2="910" y2="174" stroke="#117966" stroke-width="3" /><text x="675" y="218" font-size="25" fill="#183e39" class="b">释放旧活动对象</text><text x="675" y="258" font-size="19" fill="#183e39" >保留精简工作区</text><text x="675" y="292" font-size="17" fill="#66847b" >公开生命周期接口</text><line x1="922" y1="232" x2="962" y2="232" stroke="#117966" stroke-width="3" /><path d="M 954 225 L 962 232 L 954 239" fill="none" stroke="#117966" stroke-width="3"/><text x="985" y="158" font-size="17" fill="#117966" class="b">04</text><line x1="985" y1="174" x2="1220" y2="174" stroke="#117966" stroke-width="3" /><text x="985" y="218" font-size="25" fill="#183e39" class="b">继续聊</text><text x="985" y="258" font-size="19" fill="#183e39" >同一个 session ID</text><text x="985" y="292" font-size="17" fill="#66847b" >需要往事时再召回</text><rect x="55" y="341" width="1170" height="115" rx="6" fill="#d5eee7" /><text x="85" y="381" font-size="24" fill="#183e39" class="b">本地记忆库</text><text x="85" y="419" font-size="21" fill="#183e39" >原文档案  ·  记忆节点  ·  FAME 状态  ·  恢复检查点</text><text x="1170" y="383" font-size="25" fill="#117966" text-anchor="end" class="b">SQLite</text><text x="1170" y="421" font-size="18" fill="#66847b" text-anchor="end">每个会话独立检索</text><text x="55" y="501" font-size="18" fill="#66847b" >600 条活动事件 / 64,000 字符默认预算 / 最多加载 4 个会话</text></svg>