<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="往前聊，往事仍有回声">
<title>往前聊，往事仍有回声</title><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0} .b{font-weight:700}</style>
<rect x="0" y="0" width="1280" height="430" rx="0" fill="#f7faf8" /><text x="55" y="63" font-size="34" fill="#183e39" class="b">往前聊，往事仍有回声。</text><text x="55" y="100" font-size="19" fill="#66847b" >同一段对话里的认识、改变与重逢</text><line x1="70" y1="161" x2="1210" y2="161" stroke="#d5eee7" stroke-width="5" /><circle cx="77" cy="161" r="9" fill="#117966"/><text x="65" y="208" font-size="20" fill="#117966" class="b">03</text><text x="65" y="249" font-size="25" fill="#183e39" class="b">第一次告诉你</text><text x="65" y="296" font-size="22" fill="#183e39" >“手账第一页写着</text><text x="65" y="330" font-size="22" fill="#183e39" >慢慢来也算前进。”</text><text x="65" y="385" font-size="17" fill="#66847b" >原文归档 · 留下来源</text><circle cx="487" cy="161" r="9" fill="#117966"/><text x="475" y="208" font-size="20" fill="#117966" class="b">24</text><text x="475" y="249" font-size="25" fill="#183e39" class="b">很多话题之后</text><text x="475" y="296" font-size="22" fill="#183e39" >“第一页那句话，</text><text x="475" y="330" font-size="22" fill="#183e39" >你还记得吗？”</text><text x="475" y="385" font-size="17" fill="#66847b" >关联话题 · 按需召回</text><circle cx="897" cy="161" r="9" fill="#117966"/><text x="885" y="208" font-size="20" fill="#117966" class="b">80</text><text x="885" y="249" font-size="25" fill="#183e39" class="b">重启、恢复、再相见</text><text x="885" y="296" font-size="22" fill="#183e39" >“慢慢来也算前进。”</text><text x="885" y="330" font-size="22" fill="#183e39" >那些细节，还在。</text><text x="885" y="385" font-size="17" fill="#66847b" >同一会话 · 继续聊天</text><text x="1215" y="34" font-size="13" fill="#66847b" text-anchor="end">测试故事节选 / 虚构人物与约定</text></svg>